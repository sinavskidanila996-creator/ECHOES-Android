
name: Build ECHOES APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project
        run: |
          unzip -o ECHOES_Android_Build_v2.zip -d extracted

      - name: Locate project
        run: |
          find extracted -name settings.gradle

      - name: Build APK
        run: |
          cd extracted/ECHOES_Android_Build_v2
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ECHOES-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          
